name: Build portable KytyPS5 (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, feature/yotei-compute-prewarm-v1]
    paths:
      - '.github/workflows/windows-portable.yml'
      - 'patches/**'
      - 'tools/**'
      - 'scripts/**'
      - 'README.md'
  # PRs into the release branches (e.g. claude/* -> feature/yotei-compute-prewarm-v1) get the
  # same build, so a PR head is tested before merge instead of only after.
  pull_request:
    branches: [main, feature/yotei-compute-prewarm-v1]
    paths:
      - '.github/workflows/windows-portable.yml'
      - 'patches/**'
      - 'tools/**'
      - 'scripts/**'
      - 'README.md'

permissions:
  contents: read

# A new push to the same PR cancels its older, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast GPU-free checks (a few minutes) so a broken patch stack shows up long before the
  # Windows build finishes.
  patch-check:
    name: Patch stack applies and device-profile self-test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out patch project
        uses: actions/checkout@v4

      - name: Retrieve pinned Kyty source and Vulkan headers
        run: |
          git clone --filter=blob:none https://github.com/KytyPS5/KytyPS5.git source
          git -C source checkout 9dcff95e809ec43ba66f56648164070f4b16348f
          git -C source submodule update --init --depth 1 3rdparty/Vulkan-Headers

      - name: Apply the consolidated patch
        run: |
          patch="$GITHUB_WORKSPACE/patches/01-16-rebased-on-9dcff95.patch"
          git -C source apply --check "$patch" || { echo "::error::consolidated patch does not apply"; exit 1; }
          git -C source apply "$patch"
          echo "applied 01-16-rebased-on-9dcff95.patch"
          patch="$GITHUB_WORKSPACE/patches/17-vram-pressure-relief.patch"
          git -C source apply --check "$patch" || { echo "::error::patch 17 does not apply"; exit 1; }
          git -C source apply "$patch"
          echo "applied 17-vram-pressure-relief.patch"
          patch="$GITHUB_WORKSPACE/patches/18-frame-progress-trace.patch"
          git -C source apply --check "$patch" || { echo "::error::patch 18 does not apply"; exit 1; }
          git -C source apply "$patch"
          echo "applied 18-frame-progress-trace.patch"
          patch="$GITHUB_WORKSPACE/patches/20-stall-probe.patch"
          git -C source apply --check "$patch" || { echo "::error::patch 20 does not apply"; exit 1; }
          git -C source apply "$patch"
          echo "applied 20-stall-probe.patch"

      - name: VRAM relief policy test (GCC, ASan + UBSan)
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -Isource/src \
            source/tests/VramReliefTests.cpp -o vram_relief_tests
          ./vram_relief_tests

      - name: Stall probe test (GCC, ASan + UBSan)
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Wformat=2 -g -O1 -fsanitize=address,undefined \
            -fno-sanitize-recover=all -Itools/stall_probe_test/stub -Isource/src \
            -Isource/3rdparty/Vulkan-Headers/include tools/stall_probe_test/stall_probe_test.cpp \
            -pthread -o stall_probe_test
          ./stall_probe_test

      - name: Device-profile self-test
        run: |
          inc="-Isource/3rdparty/Vulkan-Headers/include -Itools"
          g++ -std=c++17 -Wall -Wextra $inc tools/prewarm_device_profile_test.cpp -o device_profile_test
          ./device_profile_test

  windows:
    name: Build, test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Check out patch project
        uses: actions/checkout@v4

      - name: Set up MSVC environment (clang-cl)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Retrieve pinned Kyty source and submodules
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git clone https://github.com/KytyPS5/KytyPS5.git source
          if ($LASTEXITCODE -ne 0) { throw "Upstream clone failed" }
          git -C source checkout 9dcff95e809ec43ba66f56648164070f4b16348f
          if ($LASTEXITCODE -ne 0) { throw "Pinned commit not available" }
          git -C source submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw "Failed to retrieve submodules" }

      - name: Apply the consolidated patch
        shell: pwsh
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE 'patches/01-16-rebased-on-9dcff95.patch'
          git -C source apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw "Consolidated patch validation failed" }
          git -C source apply $patch
          if ($LASTEXITCODE -ne 0) { throw "Consolidated patch application failed" }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'patches/17-vram-pressure-relief.patch'
          git -C source apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch 17 validation failed" }
          git -C source apply $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch 17 application failed" }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'patches/18-frame-progress-trace.patch'
          git -C source apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch 18 validation failed" }
          git -C source apply $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch 18 application failed" }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'patches/20-stall-probe.patch'
          git -C source apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch 20 validation failed" }
          git -C source apply $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch 20 application failed" }

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $root = Split-Path (Get-Command vcpkg -ErrorAction Stop).Source
          "root=$root" >> $env:GITHUB_OUTPUT

      - name: Install glslang tools
        shell: pwsh
        run: |
          vcpkg install 'glslang[tools,opt]:x64-windows'
          if ($LASTEXITCODE -ne 0) { throw "glslang install failed" }
          $path = Join-Path '${{ steps.vcpkg.outputs.root }}' 'installed/x64-windows/tools/glslang'
          if (!(Test-Path (Join-Path $path 'glslangValidator.exe'))) { throw "glslangValidator.exe missing" }
          $path >> $env:GITHUB_PATH

      - name: Install Qt 6 for original launcher
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure with clang-cl
        shell: cmd
        run: |
          cmake -S source -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DKYTY_BUILD_ORIGIN=Source ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Compile launcher, emulator and shader tests
        shell: cmd
        run: |
          cmake --build build --target launcher resource_tracking_tests scalar_provenance_tests vram_relief_tests --parallel 8

      - name: Run shader regression tests
        shell: cmd
        run: |
          ctest --test-dir build --output-on-failure -R "^(resource_tracking|scalar_provenance|vram_relief)$"

      - name: Install portable app and assets
        shell: cmd
        run: |
          cmake --install build --prefix install

      - name: Compile experimental compute prewarm tool
        shell: cmd
        run: |
          clang-cl /nologo /std:c++20 /EHsc /O2 /MD ^
            /I"source/3rdparty/Vulkan-Headers/include" ^
            /I"source/3rdparty/xxHash" ^
            tools/kyty_compute_prewarm.cpp ^
            /Fe:install/kyty_compute_prewarm.exe
          if errorlevel 1 exit /b 1
          if not exist install/kyty_compute_prewarm.exe exit /b 1
          install\kyty_compute_prewarm.exe --selftest
          if errorlevel 1 exit /b 1

      - name: Bundle MSVC runtime and verify output
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE 'install'
          foreach ($name in @('kyty_launcher.exe','kyty_emulator.exe','Qt6Core.dll','libwinpthread-1.dll')) {
            if (!(Test-Path (Join-Path $dest $name))) { throw "Portable package missing $name" }
          }
          if (!(Test-Path (Join-Path $dest 'platforms/qwindows.dll'))) { throw "Qt Windows platform plugin missing" }
          $crt = if ($env:VCToolsRedistDir) { Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC143.CRT' } else { '' }
          if (!(Test-Path $crt)) {
            $found = @(Get-ChildItem 'C:/Program Files/Microsoft Visual Studio/2022' -Filter Microsoft.VC143.CRT -Directory -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' })
            if ($found.Count) { $crt = $found[0].FullName }
          }
          if (!(Test-Path $crt)) { throw "MSVC runtime folder missing; refusing to publish incomplete portable package" }
          Copy-Item (Join-Path $crt '*.dll') $dest -Force
          foreach ($name in @('vcruntime140.dll','msvcp140.dll')) {
            if (!(Test-Path (Join-Path $dest $name))) { throw "Runtime DLL missing: $name" }
          }
          Copy-Item 'source/LICENSE' (Join-Path $dest 'LICENSE_KytyPS5.txt')
          Copy-Item 'patches/01-16-rebased-on-9dcff95.patch' (Join-Path $dest '01-16-rebased-on-9dcff95.patch')
          Copy-Item 'patches/17-vram-pressure-relief.patch' (Join-Path $dest '17-vram-pressure-relief.patch')
          Copy-Item 'patches/18-frame-progress-trace.patch' (Join-Path $dest '18-frame-progress-trace.patch')
          Copy-Item 'patches/20-stall-probe.patch' (Join-Path $dest '20-stall-probe.patch')
          Copy-Item 'docs/stall-probe.md' (Join-Path $dest 'STALL_PROBE_README.md')
          Copy-Item 'docs/vram-pressure-relief.md' (Join-Path $dest 'VRAM_RELIEF_README.md')
          Copy-Item 'scripts/START_SHARED_SHADER_CACHE.cmd' (Join-Path $dest 'START_SHARED_SHADER_CACHE.cmd')
          Copy-Item 'scripts/RECORD_COMPUTE_SHADERS.cmd' (Join-Path $dest 'RECORD_COMPUTE_SHADERS.cmd')
          Copy-Item 'scripts/PRECOMPILE_KNOWN_COMPUTE.cmd' (Join-Path $dest 'PRECOMPILE_KNOWN_COMPUTE.cmd')
          Copy-Item 'scripts/START_GPU_CPU_PROFILE.cmd' (Join-Path $dest 'START_GPU_CPU_PROFILE.cmd')
          Copy-Item 'scripts/PROFILE_CPU_THREADS.cmd' (Join-Path $dest 'PROFILE_CPU_THREADS.cmd')
          Copy-Item 'scripts/PROFILE_CPU_THREADS.ps1' (Join-Path $dest 'PROFILE_CPU_THREADS.ps1')
          Copy-Item 'scripts/MONITOR_CPU_GPU.cmd' (Join-Path $dest 'MONITOR_CPU_GPU.cmd')
          Copy-Item 'scripts/MONITOR_CPU_GPU.ps1' (Join-Path $dest 'MONITOR_CPU_GPU.ps1')
          Copy-Item 'docs/GPU_CPU_PROFILING.md' (Join-Path $dest 'GPU_CPU_PROFILING.md')
          Copy-Item 'docs/compute-prewarm-v02.md' (Join-Path $dest 'COMPUTE_PREWARM_README.md')
          @'
          @echo off
          cd /d "%~dp0"
          set "KYTY_DIAGNOSTIC_SKIP_YOTEI_CS=1"
          echo Experimental test: bypassing known stalled compute shader.
          echo Results may have broken graphics. Do NOT use for normal gameplay.
          start "" "%~dp0kyty_launcher.exe"
          '@ | Set-Content (Join-Path $dest 'TEST_DIAGNOSTIC_SKIP_CS.cmd') -Encoding ascii
          @'
          @echo off
          cd /d "%~dp0"
          set "KYTY_VRAM_RECOVERY=0"
          echo A/B baseline: VRAM relief (patch 17) is OFF for this run.
          start "" "%~dp0kyty_launcher.exe"
          '@ | Set-Content (Join-Path $dest 'START_WITHOUT_VRAM_RELIEF.cmd') -Encoding ascii
          @'
          Experimental unofficial KytyPS5 Windows build based on upstream source at 9dcff95 (2026-10-23),
          76 commits ahead of the earlier 7b7f9a7 pin, including upstream fixes to GPU-driven indirect
          draws, image-heap texture residency, and a GPU-thread flip-wait stall.
          Open kyty_launcher.exe after unzipping; keep all runtime DLLs and assets together.
          Requires Windows x64 and Vulkan-capable graphics drivers.
          No development software should be required to run the finished package.
          Includes patch 17 (VRAM pressure relief), untested on real hardware. See VRAM_RELIEF_README.md.
          DIAGNOSTIC BUILD: adds patch 18 (frame-progress trace), logging only. Every 5 s the log gets a
          "FrameTrace:" line. Set KYTY_FRAME_TRACE=0 to turn it off.
          DIAGNOSTIC BUILD: adds patch 20 (stall probe), diagnostic only. Long wait_reg_mem waits get
          "WaitRegMemProbe:" lines; after each GameState join the main thread is sampled
          ("MainSampler:" lines). See STALL_PROBE_README.md. Set KYTY_STALL_PROBE=0 to turn it off.
          Shader stack overflow patch is experimental and game compatibility is not guaranteed.
          Refer to this repository for the patch and corresponding upstream source.
          '@ | Set-Content (Join-Path $dest 'START_HERE.txt') -Encoding UTF8

      - name: Archive portable Windows application
        shell: pwsh
        run: |
          Compress-Archive -Path 'install/*' -DestinationPath "$env:RUNNER_TEMP/KytyPS5-Yotei-StallProbe-Diagnostic.zip" -CompressionLevel Optimal

      - name: Upload compiled Windows package
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Yotei-StallProbe-Diagnostic
          path: ${{ runner.temp }}/KytyPS5-Yotei-StallProbe-Diagnostic.zip
          if-no-files-found: error
          retention-days: 14
